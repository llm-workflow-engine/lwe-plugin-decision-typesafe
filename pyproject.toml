[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lwe-plugin-decision-typesafe"
version = "0.1.0"
description = "TypeSafe Jev decision provider for LWE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["llm-workflow-engine>=0.23", "langchain-typesafe==0.0.1a3"]

[project.entry-points."lwe_decision_providers"]
typesafe = "lwe_plugin_decision_typesafe:TypeSafeDecisionProvider"

[tool.setuptools.packages.find]
include = ["lwe_plugin_decision_typesafe*"]
